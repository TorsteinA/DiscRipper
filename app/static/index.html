<!doctype html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disc Ripper</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-full flex flex-col max-w-4xl mx-auto p-6 space-y-6">
    <!-- Header -->
    <header
      class="flex items-center justify-between border-b border-slate-800 pb-4"
    >
      <div class="flex items-baseline space-x-3">
        <div
          class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-lg self-center"
        >
          💿
        </div>
        <h1 class="text-xl font-bold tracking-tight">Disc Ripper</h1>
        <span
          id="appVersion"
          class="text-xs text-slate-400 font-mono self-baseline"
          >dev</span
        >
      </div>

      <button
        onclick="scanDrive()"
        id="scanBtn"
        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition"
      >
        Scan Drive
      </button>
    </header>

    <!-- Key Warning / Error Banner -->
    <div
      id="errorBanner"
      class="hidden p-4 rounded-lg bg-red-900/50 border border-red-700 text-red-200 text-sm"
    ></div>

    <!-- Drive Status Card -->
    <section
      class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-5 space-y-3"
    >
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
        Drive Status
      </h2>
      <div id="driveInfo" class="text-sm text-slate-300">
        Click "Scan Drive" to check for inserted media.
      </div>
    </section>

    <!-- Resume Job Section -->
    <section
      id="resume-job-section"
      class="hidden bg-slate-800/50 border border-slate-700/50 rounded-xl p-5 space-y-4"
    >
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
        Resumable Staging Jobs
      </h2>

      <!-- Dynamic job list container -->
      <div id="resumable-jobs-list" class="space-y-3"></div>
    </section>

    <!-- Rip Options Form -->
    <section
      class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-5 space-y-4"
    >
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
        Configure Rip Job
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1"
            >Title</label
          >
          <input
            type="text"
            id="titleInput"
            placeholder="e.g. Rambo"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1"
            >Year</label
          >
          <input
            type="text"
            id="yearInput"
            placeholder="e.g. 2008"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1"
            >Media Type</label
          >
          <select
            id="mediaTypeSelect"
            onchange="toggleTvFields()"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          >
            <option value="movie">Movie</option>
            <option value="show">TV Show</option>
            <option value="movie extras">Movie Extra</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1"
            >HandBrake Preset</label
          >
          <select
            id="presetSelect"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          >
            <option value="">Loading presets...</option>
          </select>
        </div>
      </div>

      <!-- Conditional TV Show Fields -->
      <div
        id="tvFields"
        class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-slate-800/80"
      >
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1"
            >Season Number</label
          >
          <input
            type="number"
            id="seasonInput"
            min="1"
            value="1"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1"
            >First Episode on Disc</label
          >
          <input
            type="number"
            id="episodeInput"
            min="1"
            value="1"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          />
        </div>
      </div>

      <!-- MakeMKV Rule Summary -->
      <div
        id="mkvPresetInfo"
        class="p-3 bg-slate-900/60 rounded-lg border border-slate-800 text-xs text-slate-400"
      >
        Loading MakeMKV track rules...
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-3 pt-2">
        <button
          type="button"
          onclick="startRipJob()"
          id="ripBtn"
          class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-semibold text-white transition shadow-sm"
        >
          Start Rip Job
        </button>
        <button
          type="button"
          onclick="performDryRun()"
          id="dryRunBtn"
          class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-medium transition text-slate-200"
        >
          Dry Run
        </button>
      </div>
    </section>

    <!-- Ripping History Card -->
    <section
      class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-5 space-y-3"
    >
      <div class="flex items-center justify-between">
        <h2
          class="text-xs font-semibold uppercase tracking-wider text-slate-400"
        >
          Ripping History
        </h2>
        <button
          onclick="loadHistory()"
          class="text-xs text-indigo-400 hover:text-indigo-300"
        >
          Refresh
        </button>
      </div>
      <div
        id="historyList"
        class="text-xs text-slate-300 divide-y divide-slate-800"
      >
        <span class="text-slate-500">No previous rip jobs recorded.</span>
      </div>
    </section>

    <script>
      let availablePresets = {};

      function toTitleCase(str) {
        if (!str) return "";
        return str
          .replace(/_/g, " ")
          .toLowerCase()
          .split(" ")
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");
      }

      function toggleTvFields() {
        const mediaType = document.getElementById("mediaTypeSelect").value;
        const tvFields = document.getElementById("tvFields");

        if (mediaType === "show") {
          tvFields.classList.remove("hidden");
        } else {
          tvFields.classList.add("hidden");
        }
      }

      function getStatusBadge(status) {
        const badgeClasses =
          "px-2 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap shrink-0";
        switch (status) {
          case "EXTRACTING":
            return `<span class="${badgeClasses} bg-amber-900/60 text-amber-300 border border-amber-700 animate-pulse">💿 EXTRACTING</span>`;
          case "EXTRACTED":
            return `<span class="${badgeClasses} bg-sky-900/60 text-sky-300 border border-sky-700">📦 STAGED</span>`;
          case "COMPRESSING":
            return `<span class="${badgeClasses} bg-indigo-900/60 text-indigo-300 border border-indigo-700 animate-pulse">⚙️ COMPRESSING</span>`;
          case "COMPLETED":
            return `<span class="${badgeClasses} bg-emerald-900/60 text-emerald-300 border border-emerald-700">✓ COMPLETED</span>`;
          case "FAILED":
            return `<span class="${badgeClasses} bg-rose-900/60 text-rose-300 border border-rose-700">✕ FAILED</span>`;
          case "FAILED_IN_STAGE_2":
            return `<span class="${badgeClasses} bg-rose-900/60 text-rose-300 border border-rose-700">✕ FAILED Stage 2</span>`;
          case "FAILED_IN_STAGE_3":
            return `<span class="${badgeClasses} bg-rose-900/60 text-rose-300 border border-rose-700">✕ FAILED Stage 3</span>`;
          default:
            return `<span class="${badgeClasses} bg-slate-800 text-slate-300 border border-slate-700">${status}</span>`;
        }
      }

      function setDriveButtonsDisabled(disabled) {
        document.getElementById("scanBtn").disabled = disabled;
        document.getElementById("ripBtn").disabled = disabled;
        document.getElementById("dryRunBtn").disabled = disabled;
      }

      async function performDryRun() {
        const btn = document.getElementById("dryRunBtn");
        const title = document.getElementById("titleInput").value.trim();
        const year = document.getElementById("yearInput").value.trim();
        const mediaType = document.getElementById("mediaTypeSelect").value;
        const presetKey = document.getElementById("presetSelect").value;
        const season =
          parseInt(document.getElementById("seasonInput").value, 10) || 1;
        const episode =
          parseInt(document.getElementById("episodeInput").value, 10) || 1;
        const banner = document.getElementById("errorBanner");

        if (!title) {
          banner.textContent =
            "Please provide a title before running a dry run.";
          banner.classList.remove("hidden");
          return;
        }
        if (!year) {
          banner.textContent =
            "Please provide a year before running a dry run.";
          banner.classList.remove("hidden");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Inspecting...";
        banner.classList.add("hidden");

        try {
          const res = await fetch("/api/dry-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: title,
              year: year,
              media_type: mediaType,
              preset_key: presetKey,
              season: season,
              episode: episode,
            }),
          });

          const data = await res.json();
          if (!res.ok) {
            banner.textContent = data.detail || "Dry run failed";
            banner.classList.remove("hidden");
            return;
          }

          console.log("Dry Run Output:", data);
          alert(
            `Dry Run Complete!\n\nTarget Dir:\n${data.target_directory}\n\nSample Output:\n${data.sample_output_file}`,
          );
        } catch (err) {
          banner.textContent = "Network error during dry run.";
          banner.classList.remove("hidden");
        } finally {
          btn.disabled = false;
          btn.textContent = "Dry Run";
        }
      }

      async function startRipJob() {
        const ripBtn = document.getElementById("ripBtn");
        const dryBtn = document.getElementById("dryRunBtn");
        const title = document.getElementById("titleInput").value.trim();
        const year = document.getElementById("yearInput").value.trim();
        const mediaType = document.getElementById("mediaTypeSelect").value;
        const presetKey = document.getElementById("presetSelect").value;
        const season = parseInt(document.getElementById("seasonInput").value);
        const episode = parseInt(document.getElementById("episodeInput").value);
        const banner = document.getElementById("errorBanner");
        const discType = window.detectedDiscType || "DVD";

        if (!title || !year) {
          banner.textContent =
            "Please provide both a Title and a Year before starting.";
          banner.classList.remove("hidden");
          return;
        }

        if (mediaType === "show") {
          // Shows must have season and episode filled in as well
          if (!episode || !season) {
            banner.textContent =
              "Plase provide Season and First Episode On Disc before starting.";
            banner.classList.remove("hidden");
            return;
          }
        }

        ripBtn.disabled = true;
        dryBtn.disabled = true;
        ripBtn.textContent = "Rip Started...";
        banner.classList.add("hidden");

        try {
          const res = await fetch("/api/rip", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: title,
              year: year,
              media_type: mediaType,
              preset_key: presetKey,
              disc_type: discType,
              season: season,
              episode: episode,
            }),
          });

          const data = await res.json();
          if (!res.ok) {
            banner.textContent = data.detail || "Failed to start rip job.";
            banner.classList.remove("hidden");
            return;
          }

          loadHistory();
        } catch (err) {
          banner.textContent = "Network error while starting rip job.";
          banner.classList.remove("hidden");
        } finally {
          ripBtn.disabled = false;
          dryBtn.disabled = false;
          ripBtn.textContent = "Start Rip Job";
        }
      }

      async function resumeJob(jobId) {
        try {
          const response = await fetch(`/api/jobs/resume/${jobId}`, {
            method: "POST",
          });

          if (!response.ok) {
            const err = await response.json();
            alert(`Failed to resume job: ${err.detail}`);
            return;
          }

          const data = await response.json();
          console.log(`Job ${data.job_id} resumed in background.`);

          // Refresh your UI history list / status polling
          if (typeof loadHistory === "function") {
            loadHistory();
          }
        } catch (error) {
          console.error("Error triggering Stage 3 resume:", error);
        }
      }
      async function loadResumableJobs() {
        const section = document.getElementById("resume-job-section");
        const container = document.getElementById("resumable-jobs-list");

        try {
          const res = await fetch("/api/jobs/resumable");
          if (!res.ok) return;

          const jobs = await res.json();

          // If no jobs exist, ensure section is hidden and exit
          if (!jobs || jobs.length === 0) {
            section.classList.add("hidden");
            container.innerHTML = "";
            return;
          }

          // Render each job card dynamically
          container.innerHTML = jobs
            .map(
              (job) => `
      <div class="flex items-center justify-between p-3 bg-slate-900/60 rounded-lg border border-slate-700/40">
        <div>
          <p class="text-sm font-medium text-slate-200">${job.title} (${job.year})</p>
          <p class="text-xs text-slate-400">ID: ${job.job_id} &bull; Preset: ${job.preset_key}</p>
        </div>
        <button 
          onclick="resumeJob('${job.job_id}')" 
          class="px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors"
        >
          Resume Stage 3
        </button>
      </div>
    `,
            )
            .join("");

          // Reveal section
          section.classList.remove("hidden");
        } catch (err) {
          console.error("Failed to fetch resumable jobs:", err);
        }
      }

      async function resumeJob(jobId) {
        try {
          const response = await fetch(`/api/jobs/resume/${jobId}`, {
            method: "POST",
          });

          if (!response.ok) {
            const err = await response.json();
            alert(`Failed to resume job: ${err.detail}`);
            return;
          }

          // Refresh the list immediately to remove/update resumed jobs
          await loadResumableJobs();
        } catch (error) {
          console.error("Error triggering Stage 3 resume:", error);
        }
      }

      async function deleteJob(jobId) {
        if (
          !confirm(
            `Are you sure you want to delete staging files for ${jobId}?`,
          )
        ) {
          return;
        }

        try {
          const response = await fetch(`/api/jobs/${jobId}`, {
            method: "DELETE",
          });

          if (!response.ok) {
            const err = await response.json();
            alert(`Failed to delete job: ${err.detail}`);
            return;
          }

          // Refresh list to update UI and hide section if no jobs remain
          await loadResumableJobs();
        } catch (error) {
          console.error("Error deleting staging job:", error);
        }
      }

      async function loadResumableJobs() {
        const section = document.getElementById("resume-job-section");
        const container = document.getElementById("resumable-jobs-list");

        try {
          const res = await fetch("/api/jobs/resumable");
          if (!res.ok) return;

          const jobs = await res.json();

          if (!jobs || jobs.length === 0) {
            section.classList.add("hidden");
            container.innerHTML = "";
            return;
          }

          container.innerHTML = jobs
            .map(
              (job) => `
      <div class="flex items-center justify-between p-3 bg-slate-900/60 rounded-lg border border-slate-700/40">
        <div>
          <p class="text-sm font-medium text-slate-200">${job.title} (${job.year})</p>
          <p class="text-xs text-slate-400">ID: ${job.job_id} &bull; Preset: ${job.preset_key}</p>
        </div>
        <div class="flex items-center gap-2">
          <button 
            onclick="resumeJob('${job.job_id}')" 
            class="px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors"
          >
            Resume
          </button>
          <button 
            onclick="deleteJob('${job.job_id}')" 
            class="px-3 py-1.5 text-xs font-medium text-rose-300 hover:text-white bg-rose-950/50 hover:bg-rose-700/80 border border-rose-800/50 rounded-lg transition-colors"
          >
            Delete
          </button>
        </div>
      </div>
    `,
            )
            .join("");

          section.classList.remove("hidden");
        } catch (err) {
          console.error("Failed to fetch resumable jobs:", err);
        }
      }

      async function loadPresets() {
        try {
          const res = await fetch("/api/presets");
          if (!res.ok) throw new Error("Failed to load presets");
          const data = await res.json();

          availablePresets = data.handbrake;
          const select = document.getElementById("presetSelect");
          select.innerHTML = "";

          Object.keys(availablePresets).forEach((key) => {
            const preset = availablePresets[key];
            const option = document.createElement("option");
            option.value = key;
            option.textContent = preset.name;
            select.appendChild(option);
          });

          const mkv = data.makemkv;
          document.getElementById("mkvPresetInfo").innerHTML = `
            <strong>MakeMKV Selection Rule:</strong> ${mkv.name}<br>
            <span class="text-slate-400">Min Title Length: ${mkv.min_length_seconds}s | Languages: ${mkv.languages.join(", ")}</span>
          `;
        } catch (err) {
          console.error(err);
        }
      }

      async function scanDrive(isInitialCheck = false) {
        const btn = document.getElementById("scanBtn");
        const info = document.getElementById("driveInfo");
        const banner = document.getElementById("errorBanner");

        setDriveButtonsDisabled(true);
        btn.textContent = isInitialCheck ? "Checking Drive..." : "Scanning...";
        banner.classList.add("hidden");

        try {
          const res = await fetch("/api/scan");
          const data = await res.json();

          if (!res.ok) {
            banner.textContent = data.detail || "Scan failed";
            banner.classList.remove("hidden");
            info.textContent = "Drive is busy or an error occurred.";
            return;
          }

          if (data.has_disc) {
            window.detectedDiscType = data.disc_type;
            info.innerHTML = `
                <div class="flex items-center space-x-2 text-emerald-400 font-medium">
                  <span>● Disc Detected</span>
                </div>
                <div class="mt-2 text-xs space-y-1 text-slate-300">
                  <div><strong>Label:</strong> ${data.label || "N/A"}</div>
                  <div><strong>Type:</strong> ${data.disc_type}</div>
                  <div><strong>Titles:</strong> ${data.title_count}</div>
                </div>
            `;

            if (data.label && !document.getElementById("titleInput").value) {
              document.getElementById("titleInput").value = toTitleCase(
                data.label,
              );
            }

            const select = document.getElementById("presetSelect");
            if (data.disc_type === "DVD" && availablePresets["dvd"]) {
              select.value = "dvd";
            } else if (
              data.disc_type === "Blu-ray" &&
              availablePresets["bluray"]
            ) {
              select.value = "bluray";
            }
          } else if (data.drive_connected) {
            info.innerHTML = `<span class="text-amber-400">No disc detected in ${data.drive}</span>`;
          } else {
            info.innerHTML = `<span class="text-amber-400">No disc drive detected at ${data.drive}</span>`;
          }
        } catch (err) {
          banner.textContent = "Network error during drive scan.";
          banner.classList.remove("hidden");
        } finally {
          btn.disabled = false;
          document.getElementById("ripBtn").disabled = false;
          document.getElementById("dryRunBtn").disabled = false;
          btn.textContent = "Scan Drive";
        }
      }

      function formatDuration(startTimeStr, endTimeStr) {
        if (!startTimeStr || !endTimeStr) return null;

        const start = new Date(startTimeStr);
        const end = new Date(endTimeStr);
        const diffMs = end - start;

        if (isNaN(diffMs) || diffMs < 0) return null;

        const totalSeconds = Math.floor(diffMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        if (hours > 0) {
          return `${hours}h ${minutes}m`;
        } else if (minutes > 0) {
          return `${minutes}m ${seconds}s`;
        }
        return `${seconds}s`;
      }

      async function loadHistory() {
        try {
          const res = await fetch("/api/history");
          if (!res.ok) return;
          const items = await res.json();
          const container = document.getElementById("historyList");

          if (items.length === 0) {
            container.innerHTML =
              '<span class="text-slate-500">No previous rip jobs recorded.</span>';
            return;
          }

          container.innerHTML = items
            .map((item) => {
              const duration = formatDuration(item.start_time, item.end_time);
              const mediaTypeFormatted = item.media_type
                ? toTitleCase(item.media_type)
                : null;

              return `
    <div class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800/60 last:border-0">
      <div class="space-y-1 min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-1.5 leading-tight">
          <span class="font-medium text-slate-200 text-sm break-words">${item.title}</span>
          ${item.year ? `<span class="text-slate-400 text-xs">(${item.year})</span>` : ""}
          ${
            mediaTypeFormatted
              ? `<span class="px-1.5 py-0.5 text-[10px] font-medium bg-slate-800 text-indigo-300 rounded border border-slate-700/60 whitespace-nowrap">${mediaTypeFormatted}</span>`
              : ""
          }
        </div>
        <div class="text-[11px] text-slate-400 flex flex-wrap items-center gap-x-2 gap-y-0.5">
          <span>${item.disc_type || "Unknown Disc"}</span>
          <span>&bull;</span>
          <span class="truncate max-w-[220px]" title="${item.preset_used}">${item.preset_used}</span>
          ${
            duration
              ? `<span>&bull;</span> <span class="text-slate-300 font-mono">⏱️ ${duration}</span>`
              : ""
          }
        </div>
      </div>
      <div class="flex items-center justify-between sm:justify-end gap-2 shrink-0">
        ${getStatusBadge(item.status)}
      </div>
    </div>
  `;
            })
            .join("");
        } catch (err) {
          console.error("Failed to load history:", err);
        }
      }

      async function loadVersion() {
        try {
          const res = await fetch("/api/version");
          if (res.ok) {
            const data = await res.json();
            document.getElementById("appVersion").textContent = data.version;
          }
        } catch (err) {
          console.error("Failed to fetch version", err);
        }
      }

      // Startup tasks
      loadVersion();
      loadHistory();
      loadPresets();
      document.addEventListener("DOMContentLoaded", () => {
        loadResumableJobs();
        // scanDrive(true);
      });
    </script>
  </body>
</html>
